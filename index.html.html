<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <style>
    :root {
      --bg-color: #1e1e2f;
      --display-bg: #0f0f1a;
      --text-color: white;
      --sidebar-bg: #25253a;
    }

    body.light {
      --bg-color: #f8f9fa;
      --display-bg: #ffffff;
      --text-color: #333333;
      --sidebar-bg: #e9ecef;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calculator {
      background: var(--bg-color);
      border-radius: 20px;
      padding: 25px;
      width: 460px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      color: var(--text-color);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .display {
      background: var(--display-bg);
      color: var(--text-color);
      font-size: 3rem;
      text-align: right;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      min-height: 110px;
      box-shadow: inset 0 8px 20px rgba(0,0,0,0.3);
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    button {
      padding: 22px 10px;
      font-size: 1.2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.92);
    }

    .btn-num { background: #33334d; color: white; }
    .btn-op { background: #ff9500; color: white; }
    .btn-sci { background: #4a4a6a; color: white; }
    .btn-clear { background: #ff3b5c; color: white; }
    .btn-equal { background: #00d26a; color: white; font-weight: bold; }
    .btn-custom { background: #9b59b6; color: white; font-weight: bold; }

    .sidebar {
      margin-top: 25px;
      background: var(--sidebar-bg);
      border-radius: 15px;
      padding: 18px;
      color: var(--text-color);
      max-height: 380px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--bg-color);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .history-item:hover {
      background: #4a4a6a;
      color: white;
    }

    .copy-btn {
      margin-top: 15px;
      width: 100%;
      padding: 15px;
      background: #9b59b6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .theme-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    body.light .theme-btn {
      background: #ddd;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="header">
      <h1>Scientific Calculator</h1>
      <button class="theme-btn" onclick="toggleTheme()">🌙 Dark / Light</button>
    </div>

    <div class="display" id="display">0</div>

    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">C</button>
      <button class="btn-clear" onclick="deleteLast()">DEL</button>
      <button class="btn-sci" onclick="append('(')">(</button>
      <button class="btn-sci" onclick="append(')')">)</button>
      <button class="btn-op" onclick="append('/')">÷</button>

      <button class="btn-sci" onclick="append('sin(')">sin</button>
      <button class="btn-sci" onclick="append('cos(')">cos</button>
      <button class="btn-sci" onclick="append('tan(')">tan</button>
      <button class="btn-sci" onclick="append('log(')">log</button>
      <button class="btn-op" onclick="append('*')">×</button>

      <button class="btn-sci" onclick="append('Math.sqrt(')">√</button>
      <button class="btn-custom" onclick="append('**')">xʸ</button>
      <button class="btn-sci" onclick="append('Math.PI')">π</button>
      <button class="btn-sci" onclick="append('Math.E')">e</button>
      <button class="btn-op" onclick="append('-')">−</button>

      <button class="btn-num" onclick="append('7')">7</button>
      <button class="btn-num" onclick="append('8')">8</button>
      <button class="btn-num" onclick="append('9')">9</button>
      <button class="btn-sci" onclick="append('%')">%</button>
      <button class="btn-op" onclick="append('+')">+</button>

      <button class="btn-num" onclick="append('4')">4</button>
      <button class="btn-num" onclick="append('5')">5</button>
      <button class="btn-num" onclick="append('6')">6</button>
      <button class="btn-sci" onclick="square()">x²</button>
      <button class="btn-equal" onclick="calculate()">=</button>

      <button class="btn-num" onclick="append('1')">1</button>
      <button class="btn-num" onclick="append('2')">2</button>
      <button class="btn-num" onclick="append('3')">3</button>
      <button class="btn-num" onclick="append('0')" style="grid-column: span 2;">0</button>
      <button class="btn-num" onclick="append('.')">.</button>
    </div>

    <button class="copy-btn" onclick="copyResult()">📋 Copy Result</button>

    <div class="sidebar">
      <h2>History</h2>
      <div id="history"></div>
    </div>
  </div>

  <script>
    let currentInput = "0";
    let display = document.getElementById("display");
    let history = [];

    function updateDisplay() {
      display.textContent = currentInput;
    }

    function append(value) {
      if (currentInput === "0" && value !== ".") currentInput = "";
      currentInput += value;
      updateDisplay();
    }

    function clearAll() {
      currentInput = "0";
      updateDisplay();
    }

    function deleteLast() {
      currentInput = currentInput.slice(0, -1) || "0";
      updateDisplay();
    }

    function square() {
      currentInput = `(${currentInput})**2`;
      updateDisplay();
    }

    function calculate() {
      try {
        let result = eval(currentInput);
        result = Number(result.toFixed(8));

        history.unshift({ expression: currentInput, result: result });
        if (history.length > 10) history.pop();

        renderHistory();

        currentInput = result.toString();
        updateDisplay();
      } catch (e) {
        currentInput = "Error";
        updateDisplay();
        setTimeout(clearAll, 1500);
      }
    }

    function renderHistory() {
      const historyDiv = document.getElementById("history");
      historyDiv.innerHTML = "";

      history.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `<strong>${item.expression}</strong><br>= ${item.result}`;
        div.onclick = () => {
          currentInput = item.result.toString();
          updateDisplay();
        };
        historyDiv.appendChild(div);
      });
    }

    function copyResult() {
      navigator.clipboard.writeText(display.textContent).then(() => {
        alert("✅ Result copied to clipboard!");
      });
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
    }

    // Initialize
    window.onload = () => {
      updateDisplay();
      renderHistory();
    };
  </script>

</body>
</html>
